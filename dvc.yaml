stages:
  limpieza_datos:
    cmd: python src/data/make_dataset.py --input data/raw/cardio_train.csv 
      --output data/processed/cardio_clean.csv
    deps:
    - data/raw/cardio_train.csv
    - src/data/make_dataset.py
    outs:
    - data/processed/cardio_clean.csv
  ingenieria_caracteristicas:
    cmd: python src/features/build_features.py --input 
      data/processed/cardio_clean.csv --output_dir data/processed/model_inputs 
      --scaler_path models/scaler.joblib
    deps:
    - data/processed/cardio_clean.csv
    - src/features/build_features.py
    outs:
    - data/processed/model_inputs
    - models/scaler.joblib
  train_random_forest:
    cmd: python src/models/train_model.py --input_dir 
      data/processed/model_inputs --model RF --models_dir models --trials 100
    deps:
    - data/processed/model_inputs
    - src/models/train_model.py
    outs:
    - models/best_model_RF.joblib
  train_logistic_regression:
    cmd: python src/models/train_model.py --input_dir 
      data/processed/model_inputs --model LR --models_dir models --trials 100
    deps:
    - data/processed/model_inputs
    - src/models/train_model.py
    outs:
    - models/best_model_LR.joblib
  train_lightgbm:
    cmd: python src/models/train_model.py --input_dir 
      data/processed/model_inputs --model LGBM --models_dir models --trials 100
    deps:
    - data/processed/model_inputs
    - src/models/train_model.py
    outs:
    - models/best_model_LGBM.joblib
  train_xgboost:
    cmd: python src/models/train_model.py --input_dir 
      data/processed/model_inputs --model XGB --models_dir models --trials 100
    deps:
    - data/processed/model_inputs
    - src/models/train_model.py
    outs:
    - models/best_model_XGB.joblib
