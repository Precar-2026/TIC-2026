stages:
  limpieza_datos:
    cmd: python src/data/make_dataset.py --input data/raw/cardio_train.csv 
      --output data/processed/cardio_clean.csv --altura_min 130 --altura_max 220 --peso_min 30 --peso_max 200 --ap_hi_min 80 --ap_hi_max 240 --ap_lo_min 50 --ap_lo_max 140
    deps:
    - data/raw/cardio_train.csv
    - src/data/make_dataset.py
    outs:
    - data/processed/cardio_clean.csv
  ingenieria_caracteristicas:
    cmd: python src/features/build_features.py --input 
      data/processed/cardio_clean.csv --output_dir data/processed/model_inputs 
      --scaler_path models/scaler.joblib --scaler_type robust --drop_features log_ap_hi,pressure_ratio,col_gluc_ratio
    deps:
    - data/processed/cardio_clean.csv
    - src/features/build_features.py
    outs:
    - data/processed/model_inputs
    - models/scaler.joblib
  seleccion_caracteristicas:
    cmd: python src/features/select_features.py --input_dir data/processed/model_inputs 
      --output_dir data/processed/model_inputs_rfecv
    deps:
    - data/processed/model_inputs
    - src/features/select_features.py
    outs:
    - data/processed/model_inputs_rfecv
  train_random_forest:
    cmd: python src/models/train_model.py --input_dir 
      data/processed/model_inputs_rfecv --model RF --models_dir models --cv_folds 5 --trials 50 --resampling_method smote --undersample_sampling_strategy 1.0 --reset_experiment
    deps:
    - data/processed/model_inputs_rfecv
    - src/models/train_model.py
    outs:
    - models/best_model_RF.joblib
  train_logistic_regression:
    cmd: python src/models/train_model.py --input_dir 
      data/processed/model_inputs_rfecv --model LR --models_dir models --cv_folds 5 --trials 50 --resampling_method smote --undersample_sampling_strategy 1.0
    deps:
    - data/processed/model_inputs_rfecv
    - src/models/train_model.py
    - models/best_model_RF.joblib
    outs:
    - models/best_model_LR.joblib
  train_xgboost:
    cmd: python src/models/train_model.py --input_dir 
      data/processed/model_inputs_rfecv --model XGB --models_dir models --cv_folds 5 --trials 50 --resampling_method smote --undersample_sampling_strategy 1.0
    deps:
    - data/processed/model_inputs_rfecv
    - src/models/train_model.py
    - models/best_model_LR.joblib
    outs:
    - models/best_model_XGB.joblib
  train_lightgbm:
    cmd: python src/models/train_model.py --input_dir 
      data/processed/model_inputs_rfecv --model LGBM --models_dir models --cv_folds 5 --trials 50 --resampling_method smote --undersample_sampling_strategy 1.0
    deps:
    - data/processed/model_inputs_rfecv
    - src/models/train_model.py
    - models/best_model_XGB.joblib
    outs:
    - models/best_model_LGBM.joblib
